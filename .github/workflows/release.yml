name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  PROJECT_PATH: OllamaAiProxy/OllamaAiProxy.csproj
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            package: OllamaAiProxy-${{ github.event.inputs.tag || github.ref_name }}-win-x64.zip
            shell: pwsh
          - rid: linux-x64
            os: ubuntu-latest
            package: OllamaAiProxy-${{ github.event.inputs.tag || github.ref_name }}-linux-x64.tar.gz
            shell: bash
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            package: OllamaAiProxy-${{ github.event.inputs.tag || github.ref_name }}-linux-arm64.tar.gz
            shell: bash
          - rid: osx-x64
            os: macos-13
            package: OllamaAiProxy-${{ github.event.inputs.tag || github.ref_name }}-osx-x64.tar.gz
            shell: bash
          - rid: osx-arm64
            os: macos-14
            package: OllamaAiProxy-${{ github.event.inputs.tag || github.ref_name }}-osx-arm64.tar.gz
            shell: bash

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Linux Native AOT dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        shell: ${{ matrix.shell }}
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o publish/${{ matrix.rid }}
          /p:PublishAot=true
          /p:PublishSingleFile=true
          /p:DebugType=None
          /p:DebugSymbols=false
          /p:Version=${{ steps.release.outputs.version }}
          /p:AssemblyVersion=${{ steps.release.outputs.version }}.0
          /p:FileVersion=${{ steps.release.outputs.version }}.0

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "dist/${{ matrix.package }}" -Force

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.package }}" -C "publish/${{ matrix.rid }}" .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/${{ matrix.package }}
          if-no-files-found: error

  release:
    name: Upload GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum OllamaAiProxy-* > SHA256SUMS.txt

      - name: Remove existing release assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.release.outputs.tag }}';
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              for (const asset of release.data.assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          files: |
            dist/OllamaAiProxy-*
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            ## 下载
            此版本提供 Native AOT 可执行程序包，无需预先安装 .NET Runtime。

            | 系统 | 架构 | 下载 |
            | --- | --- | --- |
            | Windows | x64 | `OllamaAiProxy-${{ steps.release.outputs.tag }}-win-x64.zip` |
            | Linux | x64 | `OllamaAiProxy-${{ steps.release.outputs.tag }}-linux-x64.tar.gz` |
            | Linux | ARM64 | `OllamaAiProxy-${{ steps.release.outputs.tag }}-linux-arm64.tar.gz` |
            | macOS | Intel x64 | `OllamaAiProxy-${{ steps.release.outputs.tag }}-osx-x64.tar.gz` |
            | macOS | Apple Silicon ARM64 | `OllamaAiProxy-${{ steps.release.outputs.tag }}-osx-arm64.tar.gz` |

            ## 使用
            解压后编辑 `appsettings.json`，填入 DeepSeek 或 OpenAI 的 `ApiKey`。然后运行程序：

            - Windows: `OllamaAiProxy.exe`
            - Linux/macOS: `./OllamaAiProxy`

            默认监听 `http://localhost:11434`，也可以通过环境变量 `PORT` 指定端口。

            Linux/macOS 如遇到执行权限问题，请先运行：`chmod +x OllamaAiProxy`。

            ## 校验
            下载 `SHA256SUMS.txt` 可校验附件完整性。
